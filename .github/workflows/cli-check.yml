name: CLI checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/clearport
          bash -n scripts/clearport-server
          bash -n scripts/test-haunt-history.sh
      - name: Check haunt history parsing
        run: bash scripts/test-haunt-history.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          ignore_paths: .git
